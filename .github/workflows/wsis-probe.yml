name: whatshouldistudy probe

# Temporary: fetches candidate data sources from a GitHub runner (the build
# sandbox can't reach them) and prints their structure. Only on this branch.
on:
  push:
    branches: [wsis-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whatshouldistudy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: whatshouldistudy/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: node scrapers/probe/probe.mjs

  scrapers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: whatshouldistudy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: whatshouldistudy/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: bash scrapers/probe/run-scrapers.sh
