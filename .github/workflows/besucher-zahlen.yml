name: Besucherzahlen

# Holt einmal pro Tag bei GoatCounter die Besuche des Vortags und schreibt sie
# nach analytics/. Braucht das Repository-Secret GOATCOUNTER_TOKEN (Recht
# «Read statistics»); der GoatCounter-Code kommt aus der Variable
# GOATCOUNTER_CODE oder ist «angebunden».

on:
  schedule:
    - cron: '17 4 * * *' # 04:17 UTC – der Vortag ist in Zürich dann sicher komplett
  workflow_dispatch:

concurrency:
  group: besucherzahlen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Zahlen holen
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE || 'angebunden' }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/besucher-holen.mjs

      - name: Committen, falls neu
        run: |
          # besucher.json trägt bei jedem Lauf einen frischen Zeitstempel; erst
          # committen, wenn sich in besucher.csv eine Zahl geändert hat.
          if git diff --quiet -- analytics/besucher.csv; then
            echo "Keine neuen Zahlen."
            git checkout -- analytics/
            exit 0
          fi
          git config user.name  "besucher-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/
          git commit -m "Besucherzahlen $(date -u +%F) [skip ci]"
          git push
